format_version: "3.0"
services:
  # Auth Service
  - name: auth-service
    url: http://auth-service:4001
    routes:
      - name: auth-routes
        paths:
          - /auth
        methods:
          - GET
          - POST
          - PUT
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Service:auth"

  # User Service
  - name: user-service
    url: http://user-service:4002
    routes:
      - name: user-routes
        paths:
          - /users
        methods:
          - GET
          - POST
          - PUT
          - PATCH
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              hour: 2000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Service:user"

  # Appointment Service
  - name: appointment-service
    url: http://appointment-service:5001
    routes:
      - name: appointment-routes
        paths:
          - /appointments
        methods:
          - GET
          - POST
          - PUT
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true
          - name: request-transformer
            config:
              add:
                headers:
                  - "X-Service:appointment"

  # Notification Service
  - name: notification-service
    url: http://notification-service:4003
    routes:
      - name: notification-routes
        paths:
          - /notifications
        methods:
          - GET
          - POST
        plugins:
          - name: rate-limiting
            config:
              minute: 50
              hour: 500
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true

  # Video Service
  - name: video-service
    url: http://video-service:4004
    routes:
      - name: video-routes
        paths:
          - /video
        methods:
          - GET
          - POST
        plugins:
          - name: rate-limiting
            config:
              minute: 50
              hour: 500
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization", "X-Session-Id"]
              credentials: true

  # IoT Service
  - name: iot-service
    url: http://iot-service:5002
    routes:
      - name: iot-routes
        paths:
          - /iot
        methods:
          - GET
          - POST
          - PUT
        plugins:
          - name: rate-limiting
            config:
              minute: 500
              hour: 5000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization", "X-Device-Id"]
              credentials: true

  # Prescription Service
  - name: prescription-service
    url: http://prescription-service:4005
    routes:
      - name: prescription-routes
        paths:
          - /prescriptions
        methods:
          - GET
          - POST
          - PUT
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true

  # Triage Service
  - name: triage-service
    url: http://triage-service:5003
    routes:
      - name: triage-routes
        paths:
          - /triage
        methods:
          - GET
          - POST
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 1000
              policy: redis
              redis_host: redis
              redis_port: 6379
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "OPTIONS"]
              headers: ["Accept", "Content-Type", "Authorization"]
              credentials: true

# Plugins
plugins:
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: request-id
    config:
      header_name: X-Request-ID

  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      echo_downstream: true

  - name: bot-detection
    config:
      allow:
        - "Googlebot/2.1"
        - "bingbot/2.0"

  - name: file-log
    config:
      path: /var/log/kong/access.log
      reopen: true

# Consumers (Users)
consumers:
  - username: patient_user
    custom_id: patient_001
    acls:
      - group: patients
    keyauth_credentials:
      - key: patient_key_001

  - username: doctor_user
    custom_id: doctor_001
    acls:
      - group: doctors
    keyauth_credentials:
      - key: doctor_key_001

  - username: admin_user
    custom_id: admin_001
    acls:
      - group: admins
    keyauth_credentials:
      - key: admin_key_001

# Services for Service Mesh (Istio compatible)
services:
  - name: api-gateway
    protocol: http
    port: 8000
    path: /
    retries: 3
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000

# Upstream Health Checks
upstreams:
  - name: auth-service-upstream
    targets:
      - target: auth-service:4001
        weight: 100
    healthchecks:
      active:
        type: http
        http_path: /auth/health
        healthy:
          interval: 30
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 2
      passive:
        healthy:
          successes: 1
        unhealthy:
          http_failures: 2
          tcp_failures: 2

  - name: user-service-upstream
    targets:
      - target: user-service:4002
        weight: 100
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 30
          successes: 1
        unhealthy:
          interval: 10
          http_failures: 2

# Certificate Manager (for HTTPS in production)
certificates:
  - cert: /etc/kong/certs/cert.pem
    key: /etc/kong/certs/key.pem
    snis:
      - api.smamrasa.com
      - *.smamrasa.com

# Service Mesh Integration
# For Istio, these would be defined as Kubernetes services
# with appropriate labels and selectors
